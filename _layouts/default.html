<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      var r = document.documentElement, t = null;
      r.classList.add("js");
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      r.setAttribute("data-theme", t);
    })();
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,300..600;1,14..32,300..600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230d0d0b%22/><circle cx=%2232%22 cy=%2232%22 r=%227%22 fill=%22%239d7bff%22/></svg>">
</head>
<body class="{{ page.body_class }}" id="top">
  <header class="topbar">
    <a class="topbar-name" href="{{ '/' | relative_url }}">{{ site.name }}</a>
    <nav class="topbar-nav">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/resume/' | relative_url }}"{% if page.url == '/resume/' %} aria-current="page"{% endif %}>Resume</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle" type="button" aria-label="Switch between day and night mode">
        <svg class="sunmoon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <mask id="moon-cut" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32">
            <rect x="-4" y="-4" width="32" height="32" fill="#fff"/>
            <circle class="moon-shadow" cx="24" cy="4" r="7" fill="#000"/>
          </mask>
          <g mask="url(#moon-cut)"><circle class="sun-core" cx="12" cy="12" r="4.5" fill="currentColor"/></g>
          <g class="sun-rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
          </g>
        </svg>
      </button>
    </nav>
  </header>

  {{ content }}

  {% include contact.html %}

  <div class="preview" aria-hidden="true"><img alt=""></div>
  {% if page.body_class == "home" %}<script src="{{ '/assets/js/proteins.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
