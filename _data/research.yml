- title: Learning Surrogate AI Models for Quantum Chemistry
  year: 2026
  status: In Progress
  ongoing: true
  selected: true
  summary: >-
    Own molecule-focused branch of project, contributing over 5,000 lines to a shared codebase. Preliminary results show agreement with PBE0 reaction barrier heights of <1 kcal/mol with semi-local cost.
  tags: [AI, Quantum Chemistry, Neural Operators, PyTorch, PySCF]

- title: "OrbitAll: a unified quantum mechanical representation deep learning framework for all molecular systems"
  authors: "*Beom Seok Kang, *Vignesh C Bhethanabotla, Amin Tavakoli, Maurice D Hanisch, Arimitsu Horikawa-Strakovsky, Miguel Nouman, Danish Khan, William A Goddard III, Anima Anandkumar"
  venue: Nature Computational Science
  year: 2026
  selected: true
  image: orbitall_fig.svg
  summary: >-
    Built evaluation and finetuning pipelines for OrbitAll, a physics-informed graph neural network for quantum chemistry energy prediction. 
    Discovered chemical regime where OrbitAll has flat error while the state-of-the-art UMA model (Meta FAIR) exponentially increases.
  tags: [AI, Quantum Chemistry, Graph Neural Networks, PyTorch, tblite]
  links:
    - label: Paper
      url: https://arxiv.org/abs/2507.03853

- title: Development of an artificial intelligence powered software for automated analysis of skeletal muscle ultrasonography
  authors: "*Zoe Calulo Rivera, *Felipe González-Seguel, *Arimitsu Horikawa-Strakovsky, Catherine Granger, Aarti Sarwal, Sanjay Dhar, George Ntoumenopoulos, Jin Chen, VK Cody Bumgardner, Selina M Parry, Kirby P Mayer, Yuan Wen"
  venue: Scientific Reports
  year: 2025
  selected: true
  image: myovision-us.png
  summary: >-
    Sole developer of MyoVision-US, an AI-powered software for automated analysis of skeletal muscle ultrasonography. Achieved ICC 0.85-0.99 versus experts and reduced analysis time by 99.8%. Co-first author.
  links:
    - label: Paper
      url: https://www.nature.com/articles/s41598-025-99522-7
  tags: [AI, Computer Vision, Medical Imaging, Segmentation, Transformers, CNNs, PyTorch, OpenCV]

