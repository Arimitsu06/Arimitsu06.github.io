name: Ari                     # drawn in particles on the opening screen
title: Ari
description: Personal website of Ari.
url: https://arimitsu06.github.io
baseurl: ""

# One or two sentences under your name. *Asterisks* make words italic. (SAMPLE)
tagline: >-
  Building things that make an *impact*, from software to research.

# Your resume — drop the PDF at this path and it shows on /resume/
resume_pdf: /assets/pdf/resume.pdf

# How your name appears in author lists — each is highlighted on research entries.
# Put longer forms first.
