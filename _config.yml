  - Arimitsu Horikawa-Strakovsky
  - Ari

# Small details in the opening screen. Leave any of these empty to hide it.
studying: CS and Bio Minor at Caltech
location: Pasadena, CA, USA           # SAMPLE
timezone: America/Los_Angeles         # SAMPLE — shows your live local time (IANA name)

# About section header: a photo (file in assets/img/, square crops best) next to
# your name, with `studying` underneath as the subtitle.
photo: headshot.png                               # e.g. ari.jpg — leave empty for a placeholder
full_name: Arimitsu (Ari) Horikawa-Strakovsky

# The "About" section. Markdown works: *italics* are purple; add {:.pulse} right after
# (*like this*{:.pulse}) to use the pulse color instead — red by day, blue at night.
about: >-
  Hi I'm Ari. I'm a researcher and *SURF Fellow*{:.pulse} at Caltech's Anima AI + Science Lab focusing on
  applying *AI to quantum chemistry*. Previously, I was a *Research Analyst I*{:.pulse} at the University
  of Kentucky ICU Recovery Clinic, where I built AI-powered tools and GUIs to accelerate clinicians' 
  analysis of *musculoskeletal ultrasound images*.

